<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CodePerf 分支综合报告</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        body { background: #f6f8fa; color: #172b4d; }
        .hero { background: #0b1f33; color: #ffffff; border-radius: 16px; padding: 28px; margin: 24px 0; }
        .metric { background: #ffffff; border: 1px solid #d8dee9; border-radius: 14px; padding: 18px; }
        .owner-card { border: 1px solid #d8dee9; border-radius: 14px; overflow: hidden; background: #ffffff; }
        .owner-head { background: #f1f5f9; border-bottom: 1px solid #d8dee9; padding: 16px 20px; }
        .issue { border-left: 4px solid #e67e22; padding: 16px 20px; border-bottom: 1px solid #edf1f5; }
        .issue:last-child { border-bottom: 0; }
        .badge-hit { background: #e6f4ea; color: #137333; }
        .badge-miss { background: #f1f3f4; color: #5f6368; }
        .mono { font-family: Consolas, Monaco, monospace; word-break: break-all; }
    </style>
</head>
<body>
<main class="container-fluid px-4">
    <section class="hero">
        <div class="d-flex justify-content-between align-items-start">
            <div>
                <h1 class="h3 mb-3">分支综合报告</h1>
                <div class="mono" th:text="${page.remoteUrl}">remote</div>
                <div class="mt-2">
                    <span class="badge bg-light text-dark me-2" th:text="'分支：' + ${page.branch}">分支</span>
                    <span class="badge bg-light text-dark me-2" th:text="'环境：' + ${page.env}">环境</span>
                    <span class="badge bg-light text-dark" th:text="'动态任务：' + ${page.latestDynamicTaskId}">动态任务</span>
                </div>
            </div>
            <a class="btn btn-outline-light" href="/reports">返回任务列表</a>
        </div>
    </section>

    <section class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="metric">
                <div class="text-muted">开放风险</div>
                <div class="display-6" th:text="${page.openIssueCount}">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="metric">
                <div class="text-muted">运行命中</div>
                <div class="display-6" th:text="${page.corroboratedIssueCount}">0</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="metric">
                <div class="text-muted">涉及开发者</div>
                <div class="display-6" th:text="${page.ownerCount}">0</div>
            </div>
        </div>
    </section>

    <section class="mb-4" th:each="group : ${page.ownerGroups}">
        <div class="owner-card">
            <div class="owner-head d-flex justify-content-between align-items-center">
                <div>
                    <h2 class="h5 mb-1" th:text="${group.ownerName}">开发者</h2>
                    <div class="text-muted mono" th:text="${group.ownerEmail}">email</div>
                </div>
                <div>
                    <span class="badge bg-warning text-dark me-2" th:text="'风险 ' + ${group.issueCount}">风险</span>
                    <span class="badge bg-success" th:text="'命中 ' + ${group.corroboratedCount}">命中</span>
                </div>
            </div>
            <div class="issue" th:each="issue : ${group.issues}">
                <div class="d-flex justify-content-between align-items-start gap-3">
                    <div>
                        <div class="fw-bold mono" th:text="${issue.fileName} + ':' + ${issue.lineNumber}">file:line</div>
                        <div class="text-muted mt-1">
                            <span th:text="${issue.ruleId}">rule</span>
                            <span class="mx-2">/</span>
                            <span th:text="${issue.severity}">severity</span>
                            <span class="mx-2">/</span>
                            <span th:text="${issue.ioType}">io</span>
                            <span class="mx-2">/</span>
                            <span th:text="${issue.loopMethodName}">method</span>
                        </div>
                    </div>
                    <span class="badge" th:classappend="${issue.runtimeStatus == '已运行命中'} ? ' badge-hit' : ' badge-miss'"
                          th:text="${issue.runtimeStatus}">status</span>
                </div>
                <div class="mt-3" th:if="${issue.runtimeStatus == '已运行命中'}">
                    <div><strong>入口：</strong><span th:text="${issue.runtimeEntryKey}">entry</span></div>
                    <div><strong>调用链：</strong><span class="mono" th:text="${issue.runtimeCallPath}">path</span></div>
                    <div><strong>重复调用：</strong><span th:text="'重复调用 ' + ${issue.runtimeRepeatCount} + ' 次'">重复调用 0 次</span></div>
                </div>
                <div class="mt-3 mono small text-muted" th:text="${issue.sourceFile}">source</div>
            </div>
        </div>
    </section>
</main>
</body>
</html>
