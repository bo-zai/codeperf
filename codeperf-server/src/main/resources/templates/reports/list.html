<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CodePerf 管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f7fb;
            color: #172b4d;
        }
        .topbar {
            background: linear-gradient(135deg, #0b1f3a 0%, #143d66 100%);
            color: #ffffff;
            padding: 28px 0;
            margin-bottom: 28px;
        }
        .summary-card {
            border: 0;
            border-radius: 16px;
            box-shadow: 0 10px 28px rgba(12, 31, 58, 0.08);
        }
        .risk-badge {
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 700;
        }
        .risk-warn {
            background: #fff2cc;
            color: #7a4d00;
        }
        .risk-none {
            background: #dff5e8;
            color: #126b3f;
        }
        .mono {
            font-family: Consolas, Monaco, "Courier New", monospace;
        }
        .table > :not(caption) > * > * {
            padding: 14px 16px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
<header class="topbar">
    <div class="container">
        <div class="d-flex flex-column flex-md-row justify-content-between gap-3">
            <div>
                <div class="text-uppercase small opacity-75">CodePerf Server</div>
                <h1 class="h3 mb-2">CodePerf 管理系统</h1>
                <p class="mb-0 opacity-75">集中查看静态扫描、动态证据与综合检测报告。</p>
            </div>
            <div class="text-md-end">
                <div class="small opacity-75">最近任务</div>
                <div class="display-6 fw-bold" th:text="${page.taskCount}">0</div>
            </div>
        </div>
    </div>
</header>

<main class="container pb-5">
    <section class="card summary-card">
        <div class="card-body p-0">
            <div class="px-4 py-3 border-bottom bg-white">
                <h2 class="h5 mb-1">分析任务列表</h2>
                <p class="text-muted mb-0">默认展示最近 50 条任务，报告链接可用于通知开发者排查问题。</p>
            </div>
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>项目</th>
                        <th>任务ID</th>
                        <th>分支 / 提交</th>
                        <th>环境</th>
                        <th>生成时间</th>
                        <th>风险</th>
                        <th>证据</th>
                        <th>提交人</th>
                        <th class="text-end">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(page.tasks)}">
                        <td colspan="9" class="text-center text-muted py-5">暂无分析任务</td>
                    </tr>
                    <tr th:each="task : ${page.tasks}">
                        <td>
                            <div class="fw-bold" th:text="${task.projectName}">order-service</div>
                            <div class="small text-muted text-truncate" style="max-width: 240px;"
                                 th:text="${task.commitMessage}">提交说明</div>
                        </td>
                        <td class="mono small" th:text="${task.taskId}">task-id</td>
                        <td>
                            <div th:text="${task.branch}">main</div>
                            <div class="mono small text-muted" th:text="${task.commit}">abc123</div>
                        </td>
                        <td th:text="${task.env}">dev</td>
                        <td>
                            <div class="small" th:text="${task.createdAt}">2026-07-29 15:00:00</div>
                        </td>
                        <td>
                            <span class="risk-badge"
                                  th:classappend="${task.riskLevel == 'NONE'} ? ' risk-none' : ' risk-warn'"
                                  th:text="${task.riskLevel}">WARN</span>
                        </td>
                        <td>
                            <span class="badge bg-secondary me-1" th:if="${task.hasStaticResult}">静态</span>
                            <span class="badge bg-primary" th:if="${task.hasDynamicEvidence}">动态</span>
                            <span class="text-muted small"
                                  th:if="${!task.hasStaticResult && !task.hasDynamicEvidence}">暂无</span>
                        </td>
                        <td>
                            <div th:text="${task.authorName}">Alice Dev</div>
                            <div class="small text-muted" th:text="${task.authorEmail}">alice@example.com</div>
                        </td>
                        <td class="text-end">
                            <a class="btn btn-sm btn-primary"
                               th:href="@{'/reports/' + ${task.taskId}}">查看报告</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
</body>
</html>
